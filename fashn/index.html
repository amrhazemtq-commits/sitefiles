<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ملفات المواقع</title>
<style>
:root{--bg:#0f161c;--surf:#17222b;--surf2:#1e2d38;--line:#2b3d4a;--tx:#e8eef3;--mute:#93a7b4;--acc:#5fd0bf;--acc-ink:#06211d;--warn:#f2b25c;--bad:#ff9a9a;--ok:#7fd99a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Noto Naskh Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:linear-gradient(130deg,#15323c,#11222e);border-bottom:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:#a8c7d0;font-size:13px}
main{max-width:820px;margin:auto;padding:16px}
h2{font-size:20px;margin:6px 0 10px}
h3{font-size:17px;margin:0 0 6px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--acc);color:var(--acc-ink);border:1px solid var(--acc);border-radius:12px;min-height:46px;padding:8px 14px;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #fff8;outline-offset:2px}
button.sec{background:var(--surf2);color:#bfece5;border-color:#3d5969}
button.bad{background:transparent;color:var(--bad);border-color:#895052}
button:disabled{opacity:.45}
input,select,textarea{display:block;width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:11px;margin:6px 0 14px}
textarea{min-height:130px;resize:vertical}
label{display:block;font-weight:700;font-size:14px;color:#c9d7df}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;overflow-wrap:anywhere}
.muted{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>button{flex:1 1 130px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px}
.grp{background:var(--surf);color:#bfece5;border-color:var(--line);text-align:start;min-height:76px;font-weight:600}
.grp.on{background:var(--acc);color:var(--acc-ink)}
.grp small{display:block;font-weight:400;opacity:.85}
.site.pin{border-color:var(--acc);background:#16303a;border-width:2px}
#rf{position:fixed;left:6px;top:50%;transform:translateY(-50%);width:48px;height:48px;min-height:0;padding:0;border-radius:50%;font-size:11px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6;opacity:.92;box-shadow:0 2px 8px #0008}
#rf b{font-size:17px;line-height:1;font-weight:400}
.site{display:block;width:100%;text-align:start;background:var(--surf);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;font-weight:400}
.site strong{display:block;font-size:18px;margin:4px 0}
.site .muted{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;border-radius:99px;padding:1px 10px;background:var(--surf2);border:1px solid var(--line);color:#c9d7df}
.chip.ok{color:var(--ok);border-color:#2f6a43}.chip.warn{color:var(--warn);border-color:#7a5a25}
nav{position:fixed;inset:auto 0 0 0;display:flex;gap:8px;background:#111e29;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:transparent;color:#a8c7d0;border-color:transparent;min-height:50px}
nav button.on{background:var(--surf2);color:var(--acc);border-color:#3d5969}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.file{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;overflow-wrap:anywhere}
.file img,.file video{width:100%;height:96px;object-fit:cover;border-radius:6px;display:block;margin-bottom:4px;background:#000}
.file audio{width:100%}
.file button{min-height:34px;padding:2px 8px;font-size:12px;margin-top:4px}
.toast{position:fixed;inset:auto 14px calc(90px + env(safe-area-inset-bottom)) 14px;background:#153744;border:1px solid #2f6577;border-radius:12px;padding:12px 14px;z-index:30;white-space:pre-wrap}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.box{background:var(--surf);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:640px;max-height:92%;overflow:auto}
.status{white-space:pre-wrap;color:#c1d0db;font-size:14px;min-height:20px}
.bar{height:8px;border-radius:5px;background:var(--surf2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc)}
.warn-box{background:#2a2316;border:1px solid #7a5a25;border-radius:12px;padding:12px;font-size:14px;color:#f5d9a8}
bdi{unicode-bidi:isolate}
.hd{display:flex;align-items:center;gap:12px}
.hd button.menu{flex:0 0 48px;width:48px;min-height:48px;padding:0;font-size:24px;line-height:1}
.dov{position:fixed;inset:0;background:#000a;z-index:25}
.drawer{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(310px,84vw);background:var(--surf);border-inline-end:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top)) 16px 16px;overflow:auto;animation:slin .2s ease-out}
@keyframes slin{from{transform:translateX(100%)}to{transform:none}}
.drawer .grp{width:100%;margin:6px 0}
</style>
</head>

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

    const nm=enc.encode(e.name),size=e.blob.size;if(size>0xFFFFFFF0)throw new Error('ملف أكبر من 4 جيجا');
    const crc=await crcBlob(e.blob);

async function readZip(file){

  return makeZip(entries,onProg)}

    if(rep){rec.origId=v.id;rec.dir='in';rec.confirmed=false;rec.receivedAt=Date.now();rec.status='received'}

async function compressImage(file){
  if(!S.compress||!file.type.startsWith('image/')||file.type==='image/gif')return file;
  try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const sc=Math.min(1,1920/Math.max(bmp.width,bmp.height));
    if(sc===1&&file.size<1.5e6){bmp.close&&bmp.close();return file}
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close&&bmp.close();
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
    if(b&&b.size<file.size)return new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})}catch(e){}
  return file}

    tombs.delete(r.id);
    const loc=S.custom.find(c=>c.id===r.id);
    const clean={id:r.id,label:r.label,code:r.code,category:r.category,group:r.group,org:r.org,months:r.months||[],review:!!r.review,archived:!!r.archived,updatedAt:r.updatedAt||0};
    if(!loc||JSON.stringify({...loc,updatedAt:0})!==JSON.stringify({...clean,updatedAt:0})){await dbPut('sites',clean);changed=true}}
  await dbPut('kv',[...tombs],'tomb');
  if(changed)await loadAll()}

  const r=await gcall({action:'sites-put',sites:S.pendingSites});
  if(!r.ok)throw new Error(r.error||'فشل رفع قائمة المواقع');
  S.pendingSites=[];await dbPut('kv',[],'pendingSites');
  S.sitesRev=r.rev||S.sitesRev;await dbPut('kv',S.sitesRev,'sitesRev');

    if(r.ok&&(r.rev||0)!==S.sitesRev){S.sitesRev=r.rev||0;await dbPut('kv',S.sitesRev,'sitesRev');await mergeCatalog(r.sites);if(S.view==='home'||S.view==='site')render()}

      if(S.custom.length){const r2=await gcall({action:'sites-put',sites:S.custom.map(c=>({...c,updatedAt:0}))});if(r2.ok){S.sitesRev=r2.rev||S.sitesRev;await dbPut('kv',S.sitesRev,'sitesRev');await mergeCatalog(r2.sites)}}

async function libUpload(s,list){
  const r=await gcall({action:'lib-init',site:s.id,label:s.label});if(!r.ok)throw new Error(r.error||'فشل تجهيز المجلد');
  let n=0;

    const key='lib:'+s.id+':'+uid();
    const ir=await gcall({action:'file-init',folder:r.folder,name:safeName(f.name),type:f.type||'application/octet-stream',size:f.size,key});
    if(!ir.ok)throw new Error(ir.error||'فشل بدء رفع ملف');

    if(!ir.done){while(off<f.size){
      const end=Math.min(off+CH,f.size);
      const cr=await gcall({action:'chunk',key:ir.key,offset:off,data:await b64(f.slice(off,end)),size:f.size},180000);
      if(cr.error)throw new Error(cr.error);

    await gcall({action:'lib-done',folder:r.folder,name:safeName(f.name)});
    n++;toast(`تم رفع ${n} من ${list.length} للمكتبة`)}
  await libRefresh()}

/* ----- visit view (history / inbox) ----- */

  return h('div',{class:'card'},h('h3',{},'الرفع إلى Google Drive'),
    h('p',{class:'muted'},'الصق رابط السكريبت هنا (أو الأفضل تحطه في DRIVE_URL جوه index.html عشان الفنيين يرفعوا من غير أي إعداد).'),
    h('label',{for:'gu'},'رابط السكريبت'),u,
    h('div',{class:'row'},h('button',{onclick:async()=>{const c={url:u.value.trim(),token:''};if(!/^https:\/\//.test(c.url)){st.textContent='اكتب الرابط.';return}
      const old=S.cfg;S.cfg=c;st.textContent='جاري الاختبار...';
      try{const r=await gcall({action:'ping'},30000);if(r.ok){await dbPut('kv',c,'cfg');toast('تم الربط');render();pump()}else{S.cfg=old;st.textContent='فشل: '+(r.error||'')}}catch(e){S.cfg=old;st.textContent='تعذر الاتصال: '+e.message}}},'اختبار وحفظ'),
      S.cfg?h('button',{class:'sec bad',onclick:async()=>{await dbDel('kv','cfg');S.cfg=null;render()}},'فصل'):null),st)}

  const box=h('div'),st=h('p',{class:'status'});let items=[],org='';

  const load=async()=>{if(!S.cfg){st.textContent='اربط Drive الأول.';return}st.textContent='جاري التحميل...';try{const r=await gcall({action:'list'},60000);if(!r.ok)throw new Error(r.error||'');items=r.items||[];st.textContent='';draw()}catch(e){st.textContent='تعذر التحميل: '+e.message}};

  load();return h('div',{},h('h2',{},'التقارير المرسلة'),h('p',{class:'muted'},'اللي الفنيين بعتوه بيتخزن في Drive بتاعك ومبيفضلش على هواتفهم.'),h('label',{for:'fo'},'المنظمة'),sel,h('div',{class:'row'},h('button',{class:'sec',onclick:load},'تحديث')),st,box)}
function renderMore(){
  const st=h('p',{class:'status'}),usage=h('p',{class:'muted'},'...');
  navigator.storage?.estimate?.().then(e=>{usage.textContent=`المساحة المستخدمة: ${fmtSize(e.usage||0)} من ${fmtSize(e.quota||0)}`});
  const arch=S.sites.filter(s=>s.archived);
  return h('div',{},h('h2',{},'المزيد'),driveCard(),
    h('div',{class:'card'},h('h3',{},'النسخة الاحتياطية'),h('p',{class:'muted'},'بياناتك على هذا الهاتف فقط. لو مسحت بيانات المتصفح أو التطبيق هتضيع. خد نسخة وخزّنها برا الهاتف.'),
      h('div',{class:'row'},h('button',{onclick:async()=>{st.textContent='جاري تجهيز النسخة...';try{const z=await buildZip(S.visits,'backup');download(z,`sitefiles-backup-${new Date().toISOString().slice(0,10)}.zip`);st.textContent=`تم التجهيز (${fmtSize(z.size)}).`}catch(e){st.textContent='تعذر: '+e.message}}},'تصدير نسخة كاملة'),

/* ---------- boot ---------- */
(async()=>{
  try{_db=await openDB();await loadAll();
    if(location.hash.startsWith('#cfg=')){const c=parseCfgLink(location.hash);if(c){await dbPut('kv',c,'cfg');S.cfg=c;setTimeout(()=>toast('تم ربط التطبيق بـ Google Drive'),400)}}
